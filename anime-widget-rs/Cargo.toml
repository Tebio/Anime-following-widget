[package]
name = "anime-widget"
version = "2.1.0"
edition = "2021"
description = "Windows 桌面追番小组件（单文件免安装，AGE 动漫周表）"
license = "MIT"
authors = ["Tebio"]

[[bin]]
name = "anime-widget"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.31", features = ["default_fonts", "glow"] }
egui = "0.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
scraper = "0.20"
open = "5"
dirs = "6"
percent-encoding = "2"
raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies]
tray-icon = "0.20"
# Windows 用系统 Schannel TLS（纯 Rust 绑定，单文件零外部依赖）
ureq = { version = "2.10", default-features = false, features = ["native-tls", "gzip"] }
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[target.'cfg(not(windows))'.dependencies]
# Linux/macOS 开发预览用 rustls
ureq = { version = "2.10", default-features = false, features = ["tls", "gzip"] }
