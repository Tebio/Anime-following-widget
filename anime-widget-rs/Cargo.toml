[package]
name = "anime-widget"
version = "1.2.0"
edition = "2021"
description = "Windows 追番桌面小组件（单文件免安装）"
license = "MIT"
authors = ["Tebio"]

[dependencies]
eframe = { version = "0.29", default-features = true, features = ["default_fonts", "glow"] }
egui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
ureq = { version = "2", default-features = false, features = ["tls"] }
open = "5"
dirs = "5"
anyhow = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
