name: build-rust-windows

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: "Create GitHub Release"
        type: boolean
        default: false
      release_tag:
        description: "Release tag, e.g. v1.2.0"
        type: string
        default: "v1.2.0"
  push:
    branches:
      - main
    paths:
      - "anime-widget-rs/**"
      - ".github/workflows/build-rust-windows.yml"
    tags:
      # Rust 旧版只对 v1/v2 标签构建；v3+ 由 build-csharp-exe.yml 负责
      - "v1.*"
      - "v2.*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: anime-widget-rs
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: anime-widget-rs

      - name: Build release
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Package
        shell: pwsh
        run: |
          $src = "target/x86_64-pc-windows-msvc/release/anime-widget.exe"
          $out = "../artifacts/release"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item $src "$out/AnimeWidget-win-x64.exe"
          Compress-Archive -Path "$out/AnimeWidget-win-x64.exe" -DestinationPath "$out/AnimeWidget-win-x64.zip" -Force
          Get-Item "$out/*" | Format-Table Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnimeWidget-rust-win-x64
          path: |
            artifacts/release/AnimeWidget-win-x64.exe
            artifacts/release/AnimeWidget-win-x64.zip

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/release/AnimeWidget-win-x64.exe
            artifacts/release/AnimeWidget-win-x64.zip
          generate_release_notes: true
          body: |
            ## Anime Following Widget (Rust)

            **单文件免安装** win-x64

            1. 下载 `AnimeWidget-win-x64.exe`
            2. 双击运行
            3. 点击条目打开 AgeDM / 播放链接

            设置：`%AppData%\\AnimeFollowingWidget\\settings.json`

      - name: Create GitHub Release (manual)
        if: github.event_name == 'workflow_dispatch' && inputs.create_release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: ${{ inputs.release_tag }}
          files: |
            artifacts/release/AnimeWidget-win-x64.exe
            artifacts/release/AnimeWidget-win-x64.zip
          generate_release_notes: true
          body: |
            ## Anime Following Widget (Rust)

            **单文件免安装** win-x64 — 双击即用。
