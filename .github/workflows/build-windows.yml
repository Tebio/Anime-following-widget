name: build-windows

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: "Create GitHub Release (v1.1.0 style tag required in release_tag)"
        type: boolean
        default: false
      release_tag:
        description: "Release tag, e.g. v1.1.0"
        type: string
        default: "v1.1.0"
  push:
    branches:
      - main
    tags:
      # C# 版已废弃，只对 v1.x 标签发版；v2+ 由 build-rust-windows.yml 负责
      - "v1.*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        working-directory: AnimeWidgetDesktop
        run: dotnet restore

      # 单文件 + 自包含 = 免安装，双击即用（体积较大，已内嵌运行时）
      - name: Publish single-file self-contained
        working-directory: AnimeWidgetDesktop
        run: >
          dotnet publish -c Release -r win-x64 --self-contained true
          /p:PublishSingleFile=true
          /p:EnableCompressionInSingleFile=true
          /p:IncludeNativeLibrariesForSelfExtract=true
          /p:DebugType=None
          /p:DebugSymbols=false
          -o ..\artifacts\publish

      - name: List publish output
        run: Get-ChildItem -Recurse artifacts\publish | Format-Table Name, Length

      - name: Package zip for release
        shell: pwsh
        run: |
          $out = "artifacts/release"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item "artifacts/publish/AnimeWidgetDesktop.exe" "$out/AnimeWidgetDesktop-win-x64.exe"
          Compress-Archive -Path "$out/AnimeWidgetDesktop-win-x64.exe" -DestinationPath "$out/AnimeWidgetDesktop-win-x64-singlefile.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
            retention-days: 3
          name: AnimeWidgetDesktop-win-x64-singlefile
          path: |
            artifacts/release/AnimeWidgetDesktop-win-x64.exe
            artifacts/release/AnimeWidgetDesktop-win-x64-singlefile.zip

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/release/AnimeWidgetDesktop-win-x64.exe
            artifacts/release/AnimeWidgetDesktop-win-x64-singlefile.zip
          generate_release_notes: true
          body: |
            ## Anime Following Widget

            **单文件免安装版**（win-x64，自包含 .NET 运行时）

            1. 下载 `AnimeWidgetDesktop-win-x64.exe`（或 zip）
            2. 双击运行，无需安装 .NET

            ### 说明
            - PublishSingleFile + SelfContained
            - 设置保存在 `%AppData%\AnimeFollowingWidget\settings.json`

      - name: Create GitHub Release (manual dispatch)
        if: github.event_name == 'workflow_dispatch' && inputs.create_release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: ${{ inputs.release_tag }}
          files: |
            artifacts/release/AnimeWidgetDesktop-win-x64.exe
            artifacts/release/AnimeWidgetDesktop-win-x64-singlefile.zip
          generate_release_notes: true
          body: |
            ## Anime Following Widget

            **单文件免安装版**（win-x64，自包含 .NET 运行时）

            1. 下载 `AnimeWidgetDesktop-win-x64.exe`（或 zip）
            2. 双击运行，无需安装 .NET

            ### 说明
            - PublishSingleFile + SelfContained
            - 设置保存在 `%AppData%\AnimeFollowingWidget\settings.json`
