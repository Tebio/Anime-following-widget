name: build-csharp-exe

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "csharp-app/**"
      - ".github/workflows/build-csharp-exe.yml"
    tags:
      - "v3.*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: csharp-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish single-file exe (self-contained)
        run: dotnet publish -c Release -r win-x64 --self-contained true

      - name: Publish single-file exe (framework-dependent, ~0.5MB)
        run: dotnet publish -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=false -o bin/fd

      - name: Package
        shell: pwsh
        run: |
          $out = "../artifacts/release"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item "bin/Release/net8.0-windows/win-x64/publish/AnimeWidget.exe" "$out/AnimeWidget-csharp-win-x64.exe"
          Copy-Item "bin/fd/AnimeWidget.exe" "$out/AnimeWidget-csharp-win-x64-needs-dotnet8.exe"
          Compress-Archive -Path "$out/AnimeWidget-csharp-win-x64.exe" -DestinationPath "$out/AnimeWidget-csharp-win-x64.zip" -Force
          Compress-Archive -Path "$out/AnimeWidget-csharp-win-x64-needs-dotnet8.exe" -DestinationPath "$out/AnimeWidget-csharp-win-x64-needs-dotnet8.zip" -Force
          Get-Item "$out/*" | Format-Table Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          retention-days: 3
          name: anime-widget-csharp-exe
          path: artifacts/release/*

      - name: Publish to Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v3.')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/release/*
          generate_release_notes: true
