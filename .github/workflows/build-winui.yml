name: build-winui

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "winui-app/**"
      - ".github/workflows/build-winui.yml"
    tags:
      - "v4.*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: winui-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish (unpackaged, WASDK self-contained)
        run: dotnet publish AnimeWidget.WinUI.csproj -c Release -r win-x64 -p:Platform=x64 --self-contained true -o artifacts/winui

      - name: Package folder as zip
        run: |
          Compress-Archive -Path artifacts/winui/* -DestinationPath artifacts/AnimeWidget-winui-x64.zip -Force
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnimeWidget-winui-x64
          path: winui-app/artifacts/AnimeWidget-winui-x64.zip
          retention-days: 3

      - name: Publish to Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v4.')
        uses: softprops/action-gh-release@v2
        with:
          files: winui-app/artifacts/AnimeWidget-winui-x64.zip
          generate_release_notes: true
